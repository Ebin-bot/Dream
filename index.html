<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가위바위보 · 한 판 할까요?</title>
<style>
:root{font-family:system-ui,-apple-system,"맑은 고딕",sans-serif;color:#243a38;background:#eef5ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:36px 20px;background:radial-gradient(ellipse at 10% 0%,#d9ead9,transparent 55%),#f4f6ef}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:13px;letter-spacing:2px;font-weight:800;color:#4b7564}.pill{font-size:12px;background:#fff9;padding:8px 12px;border-radius:30px}h1{font-size:clamp(32px,6vw,48px);letter-spacing:-2px;margin:30px 0 10px}p{color:#6a7c75;line-height:1.6}.card{background:#fff;border:1px solid #dce6de;border-radius:28px;padding:26px;box-shadow:0 18px 50px #2946370b}.score{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;max-width:420px;margin:26px auto}.score div+div{border-left:1px solid #e3eae4}.score span{display:block;font-size:12px;color:#738379}.score strong{font-size:30px}.arena{display:grid;grid-template-columns:1fr 45px 1fr;align-items:center;text-align:center;padding:22px 0}.hand{font-size:70px;background:#f2f6f1;border-radius:24px;max-width:180px;margin:10px auto;padding:22px 0}.label{font-size:13px;color:#64796b}.vs{font-size:13px;font-weight:800;color:#a4b2a8}.result{text-align:center;min-height:85px}.result h2{font-size:24px;margin:12px 0 5px}.result p{font-size:14px;margin:0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}button{font:inherit;cursor:pointer;touch-action:manipulation}.choice{border:1px solid #dce7dc;background:#f8faf6;border-radius:18px;padding:18px 4px;color:#314b3e;transition:transform .15s,background .15s}.choice:hover{background:#e4efe0;transform:translateY(-3px)}.choice span{display:block;font-size:36px;margin-bottom:8px}.choice small{display:block;margin-top:5px;color:#8a978e;font-size:11px}button:focus-visible{outline:3px solid #cf883c;outline-offset:3px}.choice:disabled{opacity:.5;cursor:wait;transform:none}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.bottom p{font-size:12px;margin:0}.reset{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;color:#607467;font-size:12px;padding:10px}.history{margin-top:24px}.history h3{font-size:14px;margin:0 0 12px}.history ol{list-style:none;margin:0;padding:0}.history li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e9eee8;padding:10px 0;font-size:13px;color:#647569}.empty{font-size:13px;color:#97a399}.win{color:#28784f}.lose{color:#c27750}.shake{animation:shake .2s infinite alternate}@keyframes shake{to{transform:rotate(12deg) translateY(-6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:480px){body{padding:24px 14px}.card{padding:18px}.hand{font-size:55px;padding:18px 0}.pill{display:none}.bottom{align-items:flex-start}.choice small{display:none}}
</style>
</head>
<body>
<main>
<header class="top"><div class="brand">PLAY A LITTLE</div><div class="pill">설치 없이 · 바로 플레이</div></header>
<h1>가위바위보,<br>한 판 할까요? ✨</h1>
<p>내 선택과 컴퓨터의 선택이 만나는 순간!<br>아래에서 하나를 골라 보세요.</p>
<section class="card" aria-label="가위바위보 게임">
<div class="score"><div><span>나의 승리</span><strong id="wins">0</strong></div><div><span>무승부</span><strong id="draws">0</strong></div><div><span>컴퓨터 승리</span><strong id="losses">0</strong></div></div>
<div class="arena"><div><div class="label">나</div><div id="myHand" class="hand" role="img" aria-label="선택 전">✊</div></div><div class="vs">VS</div><div><div class="label">컴퓨터</div><div id="cpuHand" class="hand" role="img" aria-label="선택 전">✊</div></div></div>
<div class="result" role="status" aria-live="polite"><h2 id="message">준비됐나요?</h2><p id="detail">가위, 바위, 보 중 하나를 선택하세요.</p></div>
<div class="choices"><button class="choice" data-choice="0"><span aria-hidden="true">✌️</span>가위<small>키보드 1</small></button><button class="choice" data-choice="1"><span aria-hidden="true">✊</span>바위<small>키보드 2</small></button><button class="choice" data-choice="2"><span aria-hidden="true">🖐️</span>보<small>키보드 3</small></button></div>
<div class="bottom"><p>컴퓨터는 매번 무작위로 선택해요.</p><button class="reset" id="reset">점수 초기화</button></div>
</section>
<section class="history" aria-label="최근 대결 기록"><h3>최근 대결 <span style="color:#95a295;font-weight:400">· 최대 5판</span></h3><p id="empty" class="empty">첫 번째 대결을 시작해 보세요.</p><ol id="history"></ol></section>
<p style="text-align:center;font-size:12px;margin-top:26px">가볍게 한 판, 기분 좋게 다시 한 판 🌿</p>
</main>
<script>
'use strict';
const names=['가위','바위','보'], icons=['✌️','✊','🖐️'];
const $=id=>document.getElementById(id);
const buttons=[...document.querySelectorAll('[data-choice]')];
let scores=[0,0,0],round=0,busy=false,timer=null;
function paint(){['wins','draws','losses'].forEach((id,i)=>$(id).textContent=scores[i]);}
function hands(a,b){$('myHand').textContent=icons[a];$('myHand').setAttribute('aria-label',names[a]);$('cpuHand').textContent=icons[b];$('cpuHand').setAttribute('aria-label',names[b]);}
function play(mine){
 if(busy)return;
 busy=true;buttons.forEach(b=>b.disabled=true);$('reset').disabled=true;
 $('message').className='';$('message').textContent='가위, 바위, 보!';$('detail').textContent='컴퓨터가 선택하고 있어요…';
 hands(1,1);$('myHand').classList.add('shake');$('cpuHand').classList.add('shake');
 timer=setTimeout(()=>{
  const cpu=Math.floor(Math.random()*3);
  const diff=(mine-cpu+3)%3;
  const result=diff===0?'무승부':diff===1?'승리':'패배';
  const index=diff===0?1:diff===1?0:2;
  scores[index]++;round++;paint();hands(mine,cpu);
  $('myHand').classList.remove('shake');$('cpuHand').classList.remove('shake');
  $('message').textContent=diff===0?'마음이 통했네요! 🤝':diff===1?'이겼어요! 🎉':'아쉽네요! 다시 도전 💪';
  $('message').className=diff===0?'':diff===1?'win':'lose';
  $('detail').textContent='나의 '+names[mine]+' · 컴퓨터의 '+names[cpu]+(diff===0?' — 한 번 더 해볼까요?':'');
  const li=document.createElement('li'),left=document.createElement('span'),right=document.createElement('strong');
  left.textContent=round+'번째 · 나 '+icons[mine]+' : '+icons[cpu]+' 컴퓨터';right.textContent=result;right.className=diff===0?'':diff===1?'win':'lose';li.append(left,right);$('history').prepend(li);
  while($('history').children.length>5)$('history').lastElementChild.remove();
  $('empty').hidden=true;busy=false;timer=null;buttons.forEach(b=>b.disabled=false);$('reset').disabled=false;
 },650);
}
buttons.forEach(b=>b.addEventListener('click',()=>play(Number(b.dataset.choice))));
document.addEventListener('keydown',e=>{if(!e.repeat&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&['1','2','3'].includes(e.key)){e.preventDefault();play(Number(e.key)-1);}});
$('reset').addEventListener('click',()=>{if(busy)return;scores=[0,0,0];round=0;paint();$('history').replaceChildren();$('empty').hidden=false;hands(1,1);$('myHand').setAttribute('aria-label','선택 전');$('cpuHand').setAttribute('aria-label','선택 전');$('message').className='';$('message').textContent='새롭게 시작해요!';$('detail').textContent='가위, 바위, 보 중 하나를 선택하세요.';});
</script>
</body>
</html>
